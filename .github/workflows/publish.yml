# Publish the Desktop-side plugin (@herenfor/dsh-wsl) to npm when a version tag is pushed (scripts/release.sh does).
# Uses npm trusted publishing: no npm token is stored in GitHub. Once, after the first release is on npm, add this
# repository and workflow (publish.yml) as the package's trusted publisher in its settings on npmjs.com.
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: npm with trusted publishing
        run: npm install -g npm@^11.5.1

      - name: The tag names the package version
        run: |
          version=$(node -p "require('./experiments/mirror/mirror/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but package.json says $version"
            exit 1
          fi

      - name: Tests
        run: node --test experiments/mirror/tests/*.test.mjs

      - name: The package carries the current bridge files
        run: |
          scripts/assemble.sh
          git diff --exit-code -- experiments/mirror/mirror || { echo "::error::run scripts/assemble.sh and commit before tagging"; exit 1; }

      - name: Publish
        working-directory: experiments/mirror/mirror
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          on_npm() { curl -sf "https://registry.npmjs.org/${name/\//%2f}" | node -e 'let s = ""; process.stdin.on("data", (c) => (s += c)).on("end", () => { let v; try { v = JSON.parse(s).versions?.[process.argv[1]] } catch {}; process.exit(v && !v.stub ? 0 : 1) })' "$version"; }
          if on_npm; then
            echo "::notice::$name@$version is already on npm (published with release.sh --local)"
            exit 0
          fi
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          npm publish --access public --tag "$tag" || { sleep 30; on_npm && echo "::notice::$name@$version went live meanwhile" && exit 0; exit 1; }
